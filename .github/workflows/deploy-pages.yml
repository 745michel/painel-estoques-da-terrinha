name: Publicar painel no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # A cada 30 min - acompanha a atualizacao local (08:30/15:00) e o Power Automate.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci

      - name: Buscar dados atualizados do SharePoint
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_SITE_HOSTNAME: ${{ secrets.SHAREPOINT_SITE_HOSTNAME }}
          SHAREPOINT_SITE_PATH: ${{ secrets.SHAREPOINT_SITE_PATH }}
          SHAREPOINT_FOLDER_PATH: ${{ secrets.SHAREPOINT_FOLDER_PATH }}
        run: npx tsx scripts/ci-refresh-data.mts
        continue-on-error: true

      - name: Gerar site estatico
        run: node scripts/build-github-pages.mjs

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
